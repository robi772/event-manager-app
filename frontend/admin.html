<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin felulet - EventManager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand"><a href="index.html">&#127915; EventManager</a></div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Esemenyek</a>
      <button onclick="logout()" class="nav-link btn-logout">Kilepes</button>
    </div>
  </nav>
  <main class="container">
    <div class="page-header">
      <h1>Admin felulet</h1>
      <p>Esemenyek jovahagyasa es kezelese</p>
    </div>
    <div class="admin-tabs">
      <button class="tab-btn active" data-tab="pending">Fuggőben levo</button>
      <button class="tab-btn" data-tab="all">Osszes esemeny</button>
      <button class="tab-btn" data-tab="users">Felhasznalok</button>
    </div>
    <div id="tab-pending" class="tab-content">
      <div id="pending-events"><div class="loading">Betoltes...</div></div>
    </div>
    <div id="tab-all" class="tab-content" style="display:none">
      <div id="all-events"><div class="loading"></div></div>
    </div>
    <div id="tab-users" class="tab-content" style="display:none">
      <div id="users-list"><div class="loading"></div></div>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
