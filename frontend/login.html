<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bejelentkezés - EventManager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand"><a href="index.html">🎫 EventManager</a></div>
  </nav>
  <main class="container">
    <div class="auth-card">
      <h2>Bejelentkezés</h2>
      <div id="error-msg" class="alert alert-error" style="display:none"></div>
      <form id="login-form">
        <div class="form-group">
          <label>E-mail cím</label>
          <input type="email" id="email" required placeholder="pelda@email.com">
        </div>
        <div class="form-group">
          <label>Jelszó</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Bejelentkezés</button>
      </form>
      <p class="auth-link">Még nincs fiókod? <a href="register.html">Regisztrálj!</a></p>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
